name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Gerar projeto Android
        run: |
          mkdir -p app/src/main/java/com/meu/launcher app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MeuLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.meu.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.meu.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.viewpager2:viewpager2:1.1.0")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Wallpaper.NoTitleBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowShowWallpaper">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <application
                  android:label="Meu Launcher"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/meu/launcher/MainActivity.kt <<'EOF'
          package com.meu.launcher

          import android.app.Activity
          import android.app.ActivityOptions
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.inputmethod.InputMethodManager
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.PopupWindow
          import android.widget.TextClock
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import androidx.viewpager2.widget.ViewPager2

          class MainActivity : Activity() {

              data class App(val label: String, val pkg: String, val intent: Intent, val icon: Drawable)

              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private val soft = Color.argb(110, 255, 255, 255)

              private var apps: List<App> = emptyList()
              private var shown: List<App> = emptyList()
              private lateinit var pager: ViewPager2
              private lateinit var overlay: LinearLayout
              private lateinit var input: EditText
              private lateinit var resultsAdapter: ArrayAdapter<String>
              private var downX = 0f
              private var downY = 0f

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  apps = queryApps()
                  buildUi()
              }

              override fun onResume() {
                  super.onResume()
                  if (queryApps().size != apps.size) recreate()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  closeSearch()
                  pager.setCurrentItem(0, true)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (overlay.visibility == View.VISIBLE) closeSearch() else pager.setCurrentItem(0, true)
              }

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (ev.actionMasked == MotionEvent.ACTION_DOWN) {
                      downX = ev.x
                      downY = ev.y
                  } else if (ev.actionMasked == MotionEvent.ACTION_UP) {
                      if (ev.y - downY > dp(140) && Math.abs(ev.x - downX) < dp(100) &&
                          overlay.visibility != View.VISIBLE
                      ) openSearch()
                  }
                  return super.dispatchTouchEvent(ev)
              }

              private fun queryApps(): List<App> {
                  val pm = packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  return pm.queryIntentActivities(main, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .map {
                          val ai = it.activityInfo
                          val launch = Intent(Intent.ACTION_MAIN)
                              .addCategory(Intent.CATEGORY_LAUNCHER)
                              .setClassName(ai.packageName, ai.name)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          App(it.loadLabel(pm).toString(), ai.packageName, launch, it.loadIcon(pm))
                      }
                      .sortedBy { it.label.lowercase() }
              }

              private fun dockApps(): List<App> {
                  val pm = packageManager
                  val probes = listOf(
                      Intent(Intent.ACTION_DIAL),
                      Intent(Intent.ACTION_VIEW, Uri.parse("sms:")),
                      Intent(Intent.ACTION_VIEW, Uri.parse("https://example.com")),
                      Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                  )
                  val out = mutableListOf<App>()
                  for (p in probes) {
                      val ri = pm.resolveActivity(p, 0) ?: continue
                      val pkg = ri.activityInfo.packageName
                      if (pkg == "android") continue
                      val a = apps.firstOrNull { it.pkg == pkg }
                      if (a != null && out.none { it.pkg == pkg }) out.add(a)
                  }
                  return out
              }

              private fun safeStart(i: Intent) {
                  try {
                      startActivity(i)
                  } catch (e: Exception) {
                  }
              }

              // 3) Animacao de abrir o app saindo do icone
              private fun launch(a: App, from: View? = null) {
                  closeSearch()
                  try {
                      if (from != null) {
                          val opts = ActivityOptions.makeScaleUpAnimation(from, 0, 0, from.width, from.height)
                          startActivity(a.intent, opts.toBundle())
                      } else {
                          startActivity(a.intent)
                      }
                  } catch (e: Exception) {
                  }
              }

              // 2) Menu ao segurar o icone
              private fun showMenu(anchor: View, a: App) {
                  anchor.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  val bg = GradientDrawable()
                  bg.cornerRadius = dp(14).toFloat()
                  bg.setColor(Color.argb(245, 44, 44, 46))
                  card.background = bg

                  val pw = PopupWindow(card, dp(210), WRAP, true)
                  pw.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                  pw.elevation = dp(10).toFloat()

                  fun item(text: String, color: Int, action: () -> Unit) {
                      val tv = TextView(this)
                      tv.text = text
                      tv.setTextColor(color)
                      tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                      tv.setPadding(dp(18), dp(14), dp(18), dp(14))
                      tv.setOnClickListener {
                          pw.dismiss()
                          action()
                      }
                      card.addView(tv, LinearLayout.LayoutParams(MATCH, WRAP))
                  }
                  item("Informações do app", Color.WHITE) {
                      safeStart(
                          Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + a.pkg))
                      )
                  }
                  item("Remover app", Color.rgb(255, 69, 58)) {
                      safeStart(Intent(Intent.ACTION_DELETE, Uri.parse("package:" + a.pkg)))
                  }
                  pw.showAsDropDown(anchor, -dp(70), 0)
              }

              private fun tile(a: App, label: Boolean): View {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER_HORIZONTAL

                  val iv = ImageView(this)
                  iv.setImageDrawable(a.icon)
                  iv.scaleType = ImageView.ScaleType.FIT_CENTER
                  iv.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(v: View, o: Outline) {
                          o.setRoundRect(0, 0, v.width, v.height, v.width * 0.225f)
                      }
                  }
                  iv.clipToOutline = true
                  box.addView(iv, LinearLayout.LayoutParams(dp(60), dp(60)))

                  if (label) {
                      val tv = TextView(this)
                      tv.text = a.label
                      tv.setTextColor(Color.WHITE)
                      tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      tv.maxLines = 1
                      tv.ellipsize = android.text.TextUtils.TruncateAt.END
                      tv.gravity = Gravity.CENTER
                      tv.setShadowLayer(4f, 0f, 1f, Color.argb(140, 0, 0, 0))
                      val lp = LinearLayout.LayoutParams(dp(68), WRAP)
                      lp.topMargin = dp(5)
                      box.addView(tv, lp)
                  }

                  // efeito de "afundar" ao tocar
                  box.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN ->
                              v.animate().scaleX(0.9f).scaleY(0.9f).setDuration(80).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                              v.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                      }
                      false
                  }
                  box.setOnClickListener { launch(a, box) }
                  box.setOnLongClickListener {
                      showMenu(box, a)
                      true
                  }
                  return box
              }

              // 1) Widget de relogio e data
              private fun buildWidget(): View {
                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.VERTICAL
                  card.gravity = Gravity.CENTER_VERTICAL
                  val bg = GradientDrawable()
                  bg.cornerRadius = dp(22).toFloat()
                  bg.setColor(Color.argb(150, 20, 20, 24))
                  card.background = bg
                  card.setPadding(dp(20), dp(12), dp(20), dp(14))

                  val time = TextClock(this)
                  time.format24Hour = "HH:mm"
                  time.format12Hour = "h:mm"
                  time.setTextColor(Color.WHITE)
                  time.setTextSize(TypedValue.COMPLEX_UNIT_SP, 46f)
                  time.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  card.addView(time, LinearLayout.LayoutParams(WRAP, WRAP))

                  val date = TextClock(this)
                  date.format24Hour = "EEEE, d 'de' MMMM"
                  date.format12Hour = "EEEE, d 'de' MMMM"
                  date.setTextColor(Color.argb(210, 255, 255, 255))
                  date.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                  card.addView(date, LinearLayout.LayoutParams(WRAP, WRAP))
                  return card
              }

              private fun buildPage(list: List<App>, rows: Int, widget: Boolean): View {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  if (widget) {
                      val wlp = LinearLayout.LayoutParams(MATCH, WRAP)
                      wlp.setMargins(dp(8), dp(4), dp(8), dp(4))
                      col.addView(buildWidget(), wlp)
                  }
                  for (r in 0 until rows) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      for (c in 0 until 4) {
                          val idx = r * 4 + c
                          val cell = FrameLayout(this)
                          if (idx < list.size) {
                              cell.addView(
                                  tile(list[idx], true),
                                  FrameLayout.LayoutParams(WRAP, WRAP, Gravity.CENTER_HORIZONTAL)
                              )
                          }
                          row.addView(cell, LinearLayout.LayoutParams(0, WRAP, 1f))
                      }
                      val lp = LinearLayout.LayoutParams(MATCH, WRAP)
                      lp.topMargin = dp(12)
                      col.addView(row, lp)
                  }
                  return col
              }

              inner class PageAdapter(private val pages: List<List<App>>) :
                  RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                  override fun getItemCount() = pages.size
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                      val f = FrameLayout(this@MainActivity)
                      f.layoutParams = RecyclerView.LayoutParams(MATCH, MATCH)
                      return object : RecyclerView.ViewHolder(f) {}
                  }
                  override fun onBindViewHolder(holder: RecyclerView.ViewHolder, position: Int) {
                      val f = holder.itemView as FrameLayout
                      f.removeAllViews()
                      val first = position == 0
                      f.addView(buildPage(pages[position], if (first) 4 else 6, first))
                  }
              }

              private fun buildUi() {
                  val root = FrameLayout(this)
                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.setPadding(dp(8), dp(48), dp(8), 0)

                  // Pagina 1: widget + 16 apps. Demais paginas: 24 apps (4 colunas x 6 linhas)
                  val pages: List<List<App>> = listOf(apps.take(16)) + apps.drop(16).chunked(24)
                  pager = ViewPager2(this)
                  pager.adapter = PageAdapter(pages)
                  content.addView(pager, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  // Bolinhas de pagina
                  val dots = LinearLayout(this)
                  dots.gravity = Gravity.CENTER
                  fun refreshDots(sel: Int) {
                      dots.removeAllViews()
                      for (i in pages.indices) {
                          val d = View(this)
                          val g = GradientDrawable()
                          g.shape = GradientDrawable.OVAL
                          g.setColor(if (i == sel) Color.WHITE else soft)
                          d.background = g
                          val lp = LinearLayout.LayoutParams(dp(7), dp(7))
                          lp.setMargins(dp(4), 0, dp(4), 0)
                          dots.addView(d, lp)
                      }
                  }
                  refreshDots(0)
                  pager.registerOnPageChangeCallback(object : ViewPager2.OnPageChangeCallback() {
                      override fun onPageSelected(position: Int) {
                          refreshDots(position)
                      }
                  })
                  content.addView(dots, LinearLayout.LayoutParams(MATCH, WRAP))

                  // Dock
                  val dockList = dockApps()
                  if (dockList.isNotEmpty()) {
                      val dock = LinearLayout(this)
                      dock.orientation = LinearLayout.HORIZONTAL
                      dock.gravity = Gravity.CENTER_VERTICAL
                      val bg = GradientDrawable()
                      bg.cornerRadius = dp(34).toFloat()
                      bg.setColor(Color.argb(90, 255, 255, 255))
                      dock.background = bg
                      dock.setPadding(dp(10), dp(14), dp(10), dp(14))
                      for (a in dockList) {
                          val cell = FrameLayout(this)
                          cell.addView(tile(a, false), FrameLayout.LayoutParams(WRAP, WRAP, Gravity.CENTER))
                          dock.addView(cell, LinearLayout.LayoutParams(0, WRAP, 1f))
                      }
                      val dlp = LinearLayout.LayoutParams(MATCH, WRAP)
                      dlp.setMargins(dp(4), dp(12), dp(4), dp(22))
                      content.addView(dock, dlp)
                  }
                  root.addView(content, FrameLayout.LayoutParams(MATCH, MATCH))

                  // Pesquisa (puxe a tela para baixo)
                  overlay = LinearLayout(this)
                  overlay.orientation = LinearLayout.VERTICAL
                  overlay.setBackgroundColor(Color.argb(225, 16, 16, 20))
                  overlay.setPadding(dp(16), dp(56), dp(16), dp(16))
                  overlay.visibility = View.GONE
                  overlay.setOnClickListener { }

                  input = EditText(this)
                  input.hint = "Pesquisar"
                  input.setHintTextColor(Color.argb(150, 255, 255, 255))
                  input.setTextColor(Color.WHITE)
                  input.maxLines = 1
                  input.isSingleLine = true
                  val ibg = GradientDrawable()
                  ibg.cornerRadius = dp(14).toFloat()
                  ibg.setColor(Color.argb(60, 255, 255, 255))
                  input.background = ibg
                  input.setPadding(dp(16), dp(12), dp(16), dp(12))
                  overlay.addView(input, LinearLayout.LayoutParams(MATCH, WRAP))

                  resultsAdapter = object : ArrayAdapter<String>(
                      this, android.R.layout.simple_list_item_1, ArrayList<String>()
                  ) {
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val v = super.getView(position, convertView, parent) as TextView
                          v.setTextColor(Color.WHITE)
                          return v
                      }
                  }
                  val list = ListView(this)
                  list.adapter = resultsAdapter
                  list.divider = null
                  list.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < shown.size) launch(shown[pos])
                  }
                  val llp = LinearLayout.LayoutParams(MATCH, 0, 1f)
                  llp.topMargin = dp(12)
                  overlay.addView(list, llp)
                  root.addView(overlay, FrameLayout.LayoutParams(MATCH, MATCH))

                  input.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          val q = s?.toString()?.trim()?.lowercase() ?: ""
                          shown = if (q.isEmpty()) apps else apps.filter { it.label.lowercase().contains(q) }
                          resultsAdapter.clear()
                          resultsAdapter.addAll(shown.map { it.label })
                      }
                  })

                  setContentView(root)
              }

              private fun openSearch() {
                  overlay.visibility = View.VISIBLE
                  input.setText("")
                  input.requestFocus()
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.showSoftInput(input, InputMethodManager.SHOW_IMPLICIT)
              }

              private fun closeSearch() {
                  if (overlay.visibility != View.VISIBLE) return
                  overlay.visibility = View.GONE
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(input.windowToken, 0)
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeuLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
