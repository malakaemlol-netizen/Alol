          cat > app/src/main/java/com/meu/launcher/LockActivity.kt <<'EOF'
          package com.meu.launcher

          import android.animation.ObjectAnimator
          import android.app.Activity
          import android.app.KeyguardManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView

          // Icone de camera desenhado a mao
          class CameraIconView(c: Context) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  p.style = Paint.Style.FILL
                  p.color = Color.argb(70, 255, 255, 255)
                  canvas.drawCircle(w / 2, h / 2, w / 2, p)
                  p.color = Color.WHITE
                  val bw = w * 0.5f
                  val bh = h * 0.36f
                  val l = (w - bw) / 2
                  val t = h / 2 - bh / 2 + h * 0.03f
                  canvas.drawRoundRect(l, t, l + bw, t + bh, w * 0.06f, w * 0.06f, p)
                  canvas.drawRoundRect(w / 2 - bw * 0.2f, t - h * 0.06f, w / 2 + bw * 0.2f, t + h * 0.02f, w * 0.03f, w * 0.03f, p)
                  p.color = Color.argb(255, 40, 40, 60)
                  canvas.drawCircle(w / 2, t + bh / 2, bh * 0.3f, p)
                  p.color = Color.WHITE
                  canvas.drawCircle(w / 2, t + bh / 2, bh * 0.17f, p)
              }
          }

          class LockActivity : Activity() {

              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              private lateinit var prefs: SharedPreferences
              private lateinit var root: FrameLayout
              private lateinit var clockBox: LinearLayout
              private lateinit var pinBox: LinearLayout
              private lateinit var camBtn: View
              private lateinit var pinTitle: TextView
              private lateinit var dotsRow: LinearLayout
              private lateinit var actionBtn: TextView

              private var downY = 0f
              private var entered = ""
              private var firstCode = ""
              private var mode = 0 // 0 = digitar, 1 = criar, 2 = confirmar
              private var pinShown = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("lock", Context.MODE_PRIVATE)
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  } else {
                      @Suppress("DEPRECATION")
                      window.addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                              WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                      )
                  }
                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  )
                  if (Build.VERSION.SDK_INT >= 28) {
                      val lp = window.attributes
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      window.attributes = lp
                  }
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT
                  buildUi()
                  applyImmersive()
              }

              private fun applyImmersive() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) applyImmersive()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  resetUi()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (pinShown) resetUi()
              }

              private fun buildUi() {
                  root = FrameLayout(this)
                  val bg = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(Color.rgb(27, 27, 58), Color.BLACK)
                  )
                  root.background = bg

                  // Relogio e data
                  clockBox = LinearLayout(this)
                  clockBox.orientation = LinearLayout.VERTICAL
                  clockBox.gravity = Gravity.CENTER_HORIZONTAL
                  clockBox.setPadding(dp(16), dp(150), dp(16), dp(16))

                  val date = TextClock(this)
                  date.format24Hour = "EEEE, d 'de' MMMM"
                  date.format12Hour = "EEEE, d 'de' MMMM"
                  date.setTextColor(Color.argb(220, 255, 255, 255))
                  date.setTextSize(TypedValue.COMPLEX_UNIT_SP, 19f)
                  clockBox.addView(date, LinearLayout.LayoutParams(WRAP, WRAP))

                  val time = TextClock(this)
                  time.format24Hour = "HH:mm"
                  time.format12Hour = "h:mm"
                  time.setTextColor(Color.WHITE)
                  time.setTextSize(TypedValue.COMPLEX_UNIT_SP, 96f)
                  time.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  clockBox.addView(time, LinearLayout.LayoutParams(WRAP, WRAP))
                  root.addView(clockBox, FrameLayout.LayoutParams(MATCH, MATCH))

                  // Teclado de codigo (estilo iPhone)
                  pinBox = LinearLayout(this)
                  pinBox.orientation = LinearLayout.VERTICAL
                  pinBox.gravity = Gravity.CENTER_HORIZONTAL
                  pinBox.setPadding(0, dp(110), 0, 0)
                  pinBox.visibility = View.GONE

                  pinTitle = TextView(this)
                  pinTitle.setTextColor(Color.WHITE)
                  pinTitle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20f)
                  pinTitle.gravity = Gravity.CENTER
                  pinBox.addView(pinTitle, LinearLayout.LayoutParams(WRAP, WRAP))

                  dotsRow = LinearLayout(this)
                  dotsRow.orientation = LinearLayout.HORIZONTAL
                  val dlp = LinearLayout.LayoutParams(WRAP, WRAP)
                  dlp.setMargins(0, dp(28), 0, dp(44))
                  pinBox.addView(dotsRow, dlp)

                  val letters = mapOf(
                      "2" to "ABC", "3" to "DEF", "4" to "GHI", "5" to "JKL",
                      "6" to "MNO", "7" to "PQRS", "8" to "TUV", "9" to "WXYZ"
                  )
                  val rows = listOf(listOf("1", "2", "3"), listOf("4", "5", "6"), listOf("7", "8", "9"))
                  for (r in rows) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      for (d in r) row.addView(keyView(d, letters[d] ?: ""), keyLp())
                      pinBox.addView(row, LinearLayout.LayoutParams(WRAP, WRAP))
                  }

                  actionBtn = TextView(this)
                  actionBtn.setTextColor(Color.WHITE)
                  actionBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17f)
                  actionBtn.gravity = Gravity.CENTER
                  actionBtn.setOnClickListener {
                      if (entered.isEmpty()) resetUi() else {
                          entered = entered.substring(0, entered.length - 1)
                          refreshDots()
                      }
                  }

                  val last = LinearLayout(this)
                  last.orientation = LinearLayout.HORIZONTAL
                  last.addView(View(this), keyLp())
                  last.addView(keyView("0", ""), keyLp())
                  last.addView(actionBtn, keyLp())
                  pinBox.addView(last, LinearLayout.LayoutParams(WRAP, WRAP))
                  root.addView(pinBox, FrameLayout.LayoutParams(MATCH, MATCH))

                  // Camera
                  camBtn = CameraIconView(this)
                  camBtn.setOnClickListener { openCamera() }
                  val clp = FrameLayout.LayoutParams(dp(58), dp(58), Gravity.BOTTOM or Gravity.END)
                  clp.setMargins(0, 0, dp(40), dp(64))
                  root.addView(camBtn, clp)

                  // Deslizar para cima mostra o teclado
                  root.setOnTouchListener { _, e ->
                      if (pinShown) return@setOnTouchListener false
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> downY = e.rawY
                          MotionEvent.ACTION_MOVE -> {
                              val dy = e.rawY - downY
                              if (dy < 0) {
                                  clockBox.translationY = dy / 2
                                  clockBox.alpha = (1f + dy / dp(300)).coerceIn(0f, 1f)
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              val dy = e.rawY - downY
                              if (dy < -dp(100)) showPin()
                              else clockBox.animate().translationY(0f).alpha(1f).setDuration(150).start()
                          }
                      }
                      true
                  }

                  refreshDots()
                  setContentView(root)
              }

              private fun keyLp(): LinearLayout.LayoutParams {
                  val lp = LinearLayout.LayoutParams(dp(78), dp(78))
                  lp.setMargins(dp(13), dp(7), dp(13), dp(7))
                  return lp
              }

              private fun keyView(d: String, sub: String): View {
                  val b = LinearLayout(this)
                  b.orientation = LinearLayout.VERTICAL
                  b.gravity = Gravity.CENTER
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(Color.argb(55, 255, 255, 255))
                  b.background = bg

                  val n = TextView(this)
                  n.text = d
                  n.setTextColor(Color.WHITE)
                  n.setTextSize(TypedValue.COMPLEX_UNIT_SP, 32f)
                  n.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  n.includeFontPadding = false
                  n.gravity = Gravity.CENTER
                  b.addView(n, LinearLayout.LayoutParams(WRAP, WRAP))

                  if (sub.isNotEmpty()) {
                      val l = TextView(this)
                      l.text = sub
                      l.setTextColor(Color.WHITE)
                      l.setTextSize(TypedValue.COMPLEX_UNIT_SP, 9f)
                      l.typeface = Typeface.DEFAULT_BOLD
                      l.letterSpacing = 0.15f
                      l.includeFontPadding = false
                      l.gravity = Gravity.CENTER
                      b.addView(l, LinearLayout.LayoutParams(WRAP, WRAP))
                  }

                  b.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> bg.setColor(Color.argb(140, 255, 255, 255))
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> bg.setColor(Color.argb(55, 255, 255, 255))
                      }
                      false
                  }
                  b.setOnClickListener { press(d) }
                  return b
              }

              private fun refreshDots() {
                  dotsRow.removeAllViews()
                  for (i in 0 until 4) {
                      val v = View(this)
                      val g = GradientDrawable()
                      g.shape = GradientDrawable.OVAL
                      g.setColor(if (i < entered.length) Color.WHITE else Color.TRANSPARENT)
                      g.setStroke(dp(2), Color.WHITE)
                      v.background = g
                      val lp = LinearLayout.LayoutParams(dp(15), dp(15))
                      lp.setMargins(dp(10), 0, dp(10), 0)
                      dotsRow.addView(v, lp)
                  }
                  actionBtn.text = if (entered.isEmpty()) "Cancelar" else "Apagar"
              }

              private fun resetUi() {
                  pinShown = false
                  entered = ""
                  firstCode = ""
                  root.animate().cancel()
                  root.translationY = 0f
                  clockBox.animate().cancel()
                  clockBox.alpha = 1f
                  clockBox.translationY = 0f
                  camBtn.visibility = View.VISIBLE
                  pinBox.animate().cancel()
                  pinBox.visibility = View.GONE
                  pinBox.alpha = 0f
                  refreshDots()
              }

              private fun showPin() {
                  pinShown = true
                  entered = ""
                  firstCode = ""
                  mode = if (prefs.getString("hash", null) == null) 1 else 0
                  pinTitle.text = if (mode == 1) "Crie um código" else "Digite o código"
                  refreshDots()
                  camBtn.visibility = View.GONE
                  clockBox.animate().alpha(0f).setDuration(150).start()
                  pinBox.alpha = 0f
                  pinBox.translationY = dp(40).toFloat()
                  pinBox.visibility = View.VISIBLE
                  pinBox.animate().alpha(1f).translationY(0f).setDuration(220).start()
              }

              private fun blockedLeft(): Long {
                  val left = prefs.getLong("until", 0L) - System.currentTimeMillis()
                  return if (left > 0) left else 0L
              }

              private fun press(d: String) {
                  val left = blockedLeft()
                  if (left > 0) {
                      pinTitle.text = "Tente novamente em " + (left / 1000 + 1) + "s"
                      return
                  }
                  if (entered.length >= 4) return
                  entered += d
                  refreshDots()
                  if (entered.length == 4) {
                      dotsRow.postDelayed({ submit() }, 120)
                  }
              }

              private fun submit() {
                  val code = entered
                  if (code.length != 4) return
                  when (mode) {
                      0 -> if (check(code)) {
                          prefs.edit().putInt("fails", 0).apply()
                          unlock()
                      } else wrong()
                      1 -> {
                          firstCode = code
                          mode = 2
                          pinTitle.text = "Confirme o código"
                          entered = ""
                          refreshDots()
                      }
                      else -> if (code == firstCode) {
                          save(code)
                          unlock()
                      } else {
                          firstCode = ""
                          mode = 1
                          shake()
                          pinTitle.text = "Os códigos não coincidem. Crie de novo"
                          entered = ""
                          refreshDots()
                      }
                  }
              }

              private fun wrong() {
                  val f = prefs.getInt("fails", 0) + 1
                  shake()
                  entered = ""
                  refreshDots()
                  if (f >= 5) {
                      prefs.edit().putInt("fails", 0).putLong("until", System.currentTimeMillis() + 30000L).apply()
                      pinTitle.text = "Tente novamente em 30s"
                  } else {
                      prefs.edit().putInt("fails", f).apply()
                      pinTitle.text = "Código incorreto"
                  }
              }

              private fun shake() {
                  dotsRow.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                  val d = resources.displayMetrics.density
                  ObjectAnimator.ofFloat(
                      dotsRow, "translationX",
                      0f, -14f * d, 14f * d, -11f * d, 11f * d, -6f * d, 6f * d, 0f
                  ).setDuration(400).start()
              }

              private fun hash(code: String, salt: String): String {
                  val md = java.security.MessageDigest.getInstance("SHA-256")
                  return md.digest((salt + ":" + code).toByteArray()).joinToString("") { "%02x".format(it) }
              }

              private fun save(code: String) {
                  val salt = java.util.UUID.randomUUID().toString()
                  prefs.edit().putString("salt", salt).putString("hash", hash(code, salt)).apply()
              }

              private fun check(code: String): Boolean {
                  val salt = prefs.getString("salt", "") ?: ""
                  return hash(code, salt) == prefs.getString("hash", null)
              }

              private fun unlock() {
                  root.animate().translationY(-root.height.toFloat()).setDuration(160).withEndAction {
                      try {
                          val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                          km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                              override fun onDismissSucceeded() {
                                  finishAndRemoveTask()
                              }
                              override fun onDismissError() {
                                  finishAndRemoveTask()
                              }
                              override fun onDismissCancelled() {
                                  resetUi()
                              }
                          })
                      } catch (e: Exception) {
                          finishAndRemoveTask()
                      }
                  }.start()
              }

              private fun openCamera() {
                  try {
                      val secure = Intent("android.media.action.STILL_IMAGE_CAMERA_SECURE")
                      secure.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (secure.resolveActivity(packageManager) != null) {
                          startActivity(secure)
                          return
                      }
                      val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                      km.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
                          override fun onDismissSucceeded() {
                              try {
                                  val i = Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(i)
                              } catch (e: Exception) {
                              }
                              finishAndRemoveTask()
                          }
                      })
                  } catch (e: Exception) {
                  }
              }
          }
