          package com.meu.launcher

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.IBinder

          class LockService : Service() {

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent?) {
                      try {
                          val it = Intent(c, LockActivity::class.java)
                          it.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK or
                                  Intent.FLAG_ACTIVITY_NO_ANIMATION or
                                  Intent.FLAG_ACTIVITY_REORDER_TO_FRONT
                          )
                          c.startActivity(it)
                      } catch (e: Exception) {
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("lock", "Tela de bloqueio", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, "lock")
                      .setContentTitle("Tela de bloqueio ativa")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                      .build()
                  startForeground(1, n)
                  val f = IntentFilter()
                  f.addAction(Intent.ACTION_SCREEN_OFF)
                  f.addAction(Intent.ACTION_SCREEN_ON)
                  registerReceiver(receiver, f)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      unregisterReceiver(receiver)
                  } catch (e: Exception) {
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
